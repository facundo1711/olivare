<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Recetas e ideas para disfrutar el aceite de oliva.">
    <title>
      Recetas | OLIVARÉ
    </title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <header id="site-header">
    </header>
    <main>
      <section class="page-hero recipes-hero">
        <div class="container">
          <p class="eyebrow text-light">
            INSPIRACIÓN PARA TU MESA
          </p>
          <h1>
            Recetas y experiencias
          </h1>
          <p>
            Pequeños detalles, grandes sabores.
          </p>
        </div>
      </section>
      <section class="section-pad">
        <div class="container">
          <div class="catalog-top">
            <div>
              <p class="eyebrow">
                IDEAS PARA COMPARTIR
              </p>
              <h2 class="section-title">
                Cociná con inspiración
              </h2>
            </div>
            <div class="filter-pills" role="group" aria-label="Filtrar recetas">
              <button class="filter-btn active" data-recipe-filter="Todas">
                Todas
              </button>
              <button class="filter-btn" data-recipe-filter="Entradas">
                Entradas
              </button>
              <button class="filter-btn" data-recipe-filter="Principales">
                Principales
              </button>
              <button class="filter-btn" data-recipe-filter="Consejos">
                Consejos
              </button>
            </div>
          </div>
          <div class="row g-4 mt-2" id="recipe-catalog">
          </div>
        </div>
      </section>
      <section class="section-pad section-soft">
        <div class="container text-center">
          <p class="eyebrow">
            EL TOQUE FINAL
          </p>
          <h2 class="section-title">
            Un buen aceite transforma lo cotidiano.
          </h2>
          <p class="body-copy mx-auto">
            Probá, combiná y encontrá tu manera favorita de disfrutarlo.
          </p>
          <a href="productos.html" class="btn btn-olive">
            Elegir productos
            <i class="bi bi-arrow-right ms-2">
            </i>
          </a>
        </div>
      </section>
    </main>
    <footer id="site-footer">
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/main.js">
    </script>
  </body>
</html>
